name: Plugin problem
description: Report a problem with a plugin listed in the index
labels: ["plugin"]
body:
  - type: input
    id: plugin
    attributes:
      label: Plugin id and version
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: What you expected, what happened instead, and your platform.
    validations:
      required: true
