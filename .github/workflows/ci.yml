name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --check scripts/validate.mjs && node --check scripts/publish.mjs && node --check scripts/minisign.mjs && node --check templates/agent-plugin/agent.mjs
      # Downloads every listed artifact, so a hash that does not match its release fails the change.
      - run: node scripts/validate.mjs --artifacts

  providers:
    name: providers (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -count=1 -race ./...
      # Every source plugin must build and pack for every platform it lists,
      # and merge into a published index without releasing or signing.
      - run: mkdir "$RUNNER_TEMP/published" && node scripts/publish.mjs --into "$RUNNER_TEMP/published" --dry-run

  manifests:
    name: manifests (v3)
    runs-on: ubuntu-latest
    env:
      # The Coursive commit whose v3 manifest rules (spec 0031) and source
      # market (spec 0025) the manifests here are checked against. Bump it
      # when either changes in Coursive.
      COURSIVE_REF: f0b9cdf80864bf2a07bcf32b2b9aadaaf7805597
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: WALKERKILLER/Coursive
          ref: ${{ env.COURSIVE_REF }}
          path: .coursive
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            agent/scripts/validate-plugin.mjs
            agent/src/plugin-manifest.mjs
            agent/src/plugins.mjs
            daemon/internal/sources/market.go
            daemon/internal/sources/protocol.go
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --check scripts/check-manifests.mjs
      # Builds every declared executable, so --files can require it.
      - run: node scripts/pack-sources.mjs --out "$RUNNER_TEMP/packed" --all
      - run: node scripts/check-manifests.mjs --rules .coursive --files --index "$RUNNER_TEMP/packed/index.json"
